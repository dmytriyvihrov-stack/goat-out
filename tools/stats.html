<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Run Stats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@400;700&family=Alegreya+SC:wght@700&display=swap" rel="stylesheet">
<style>
  /* RUN STATS: every life's report (js/stats.js), read out of this browser (served from the game's own
     origin), out of files (the dev drawer's SAVE STATS), or off our own worker (tools/stats-worker):
     SERVER asks its address and the READ_KEY once and keeps them in this browser only. No dependencies: the bars are SVG drawn here.
     THE FUNNEL is the players, not the lives: each step's first time (`Stats.step`), plus what the lives say. */
  :root { --bg: #16121c; --panel: #221b2c; --ink: #efe6d0; --dim: rgba(239,230,208,0.6); --gold: #f7d774; --line: rgba(239,230,208,0.14); }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 Alegreya, Georgia, serif; }
  header { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 2px solid #e0ac3e; padding: 12px 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  h1 { font: 700 22px 'Alegreya SC', serif; color: var(--gold); margin: 0 12px 0 0; }
  button, select, label.file { font: 700 13px 'Alegreya SC', serif; background: rgba(247,215,116,0.12); color: var(--ink); border: 1px solid #e0ac3e; padding: 6px 12px; cursor: pointer; }
  select option { background: var(--panel); }
  label.chk { font-size: 13px; color: var(--dim); display: flex; gap: 4px; align-items: center; }
  #status { color: var(--dim); font-size: 13px; }
  main { max-width: 1180px; margin: 0 auto; padding: 16px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .tile { background: var(--panel); padding: 10px 14px; }
  .tile b { display: block; font: 700 28px 'Alegreya SC', serif; color: var(--gold); }
  .tile span { color: var(--dim); font-size: 13px; }
  .funnel { margin-bottom: 14px; }
  .funnel table td { padding: 5px 6px; }
  .funnel .fb { height: 18px; background: #e0ac3e; display: block; min-width: 2px; }
  .funnel td.lab { width: 32%; } .funnel td.track { width: 40%; }
  .funnel td.drop { color: var(--dim); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(520px, 100%), 1fr)); gap: 14px; }
  section { background: var(--panel); padding: 12px 14px; border-left: 3px solid #e0ac3e; min-width: 0; }
  section h2 { font: 700 15px 'Alegreya SC', serif; margin: 0 0 4px; color: var(--gold); }
  section p.sub { margin: 0 0 8px; color: var(--dim); font-size: 13px; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; color: var(--dim); margin-bottom: 6px; }
  .legend i { display: inline-block; width: 10px; height: 10px; margin-right: 4px; vertical-align: -1px; }
  svg { width: 100%; height: auto; display: block; }
  svg text { fill: rgba(239,230,208,0.7); font: 12px Alegreya, serif; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { text-align: left; font: 700 12.5px 'Alegreya SC', serif; color: var(--dim); border-bottom: 1px solid var(--line); padding: 4px 6px; }
  td { padding: 3px 6px; border-bottom: 1px solid var(--line); }
  td.n { text-align: right; font-variant-numeric: tabular-nums; }
  .bar { height: 8px; background: #e0ac3e; display: inline-block; vertical-align: middle; }
  .scroll { max-height: 420px; overflow: auto; }
  .empty { color: var(--dim); padding: 30px; text-align: center; }
  details { margin-top: 6px; } summary { cursor: pointer; color: var(--dim); font-size: 13px; }
  /* The date range (6 Oct 2026): every chart, table and the funnel read only what falls inside it. */
  .range { display: flex; gap: 6px; align-items: center; padding: 3px 8px; border: 1px solid rgba(224,172,62,0.5); }
  .range label { font: 700 13px 'Alegreya SC', serif; color: var(--gold); }
  .range input { font: 14px Alegreya, serif; background: var(--panel); color: var(--ink); border: 1px solid #e0ac3e; padding: 4px 6px; color-scheme: dark; }
  .range.on { background: rgba(247,215,116,0.14); border-color: #e0ac3e; }
  /* Floor by room grids: a cell's shade is its share of the grid's largest value. */
  table.rg td, table.rg th { text-align: center; padding: 3px 2px; min-width: 26px; font-size: 13px; }
  table.rg td.f { text-align: left; white-space: nowrap; padding-right: 8px; }
  table.rg td.x { color: rgba(239,230,208,0.25); }
  /* SUMMARY / PLAYERS (12 Oct 2026, Google Forms' Summary / Individual) and the skill tags. */
  .views button.on { background: #e0ac3e; color: #17131c; }
  .pbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 14px; }
  .pbar select { font: 15px Alegreya, serif; background: var(--panel); color: var(--ink); border: 1px solid #e0ac3e; padding: 5px 8px; max-width: 100%; }
  .tag { display: inline-block; font: 700 12px 'Alegreya SC', serif; padding: 1px 7px; border-radius: 3px; color: #17131c; white-space: nowrap; }
  .tag.beginner { background: #6fc28a; } .tag.middle { background: #e0ac3e; } .tag.pro { background: #e3604f; } .tag.new { background: #8a8780; }
  .tag.big { font-size: 22px; padding: 3px 14px; }
  tr.pick { cursor: pointer; } tr.pick:hover td { background: rgba(224,172,62,0.12); }
  .chip { display: inline-block; font-size: 12px; padding: 0 5px; margin: 1px; border-radius: 2px; }
  .chip.ok { background: rgba(111,194,138,0.3); } .chip.died { background: rgba(227,96,79,0.35); } .chip.left { background: rgba(138,135,128,0.35); }
  .wide { grid-column: 1 / -1; }
  pre { white-space: pre-wrap; font: 12px/1.35 ui-monospace, Consolas, monospace; color: var(--dim); max-height: 300px; overflow: auto; }
  /* The build picker (13 Oct 2026): every build by its date, newest first, and on the pointer what was in it (CHANGELOG.md). */
  .bpick { position: relative; }
  .blist { position: absolute; top: calc(100% + 4px); left: 0; z-index: 5; display: flex; flex-wrap: wrap; width: min(820px, calc(100vw - 32px));
    background: var(--panel); border: 1px solid #e0ac3e; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
  .blist[hidden] { display: none; }
  .blist .rows { flex: 1 1 330px; max-height: min(70vh, 560px); overflow: auto; border-right: 1px solid var(--line); }
  .blist .info { flex: 1 1 330px; padding: 10px 14px; max-height: min(70vh, 560px); overflow: auto; font-size: 13.5px; }
  .blist .info h3 { font: 700 15px 'Alegreya SC', serif; color: var(--gold); margin: 0 0 2px; }
  .blist .info .when { color: var(--dim); font-size: 13px; margin-bottom: 8px; }
  .blist .info h4 { font: 700 13px 'Alegreya SC', serif; color: var(--ink); margin: 8px 0 2px; }
  .blist .info ul { margin: 0; padding-left: 18px; } .blist .info li { margin: 1px 0; }
  .brow { display: grid; grid-template-columns: 56px 64px 1fr auto; gap: 8px; align-items: baseline; width: 100%; text-align: left;
    background: none; border: 0; border-bottom: 1px solid var(--line); padding: 6px 10px; font: 13.5px Alegreya, serif; color: var(--ink); cursor: pointer; }
  .brow b { font: 700 13.5px 'Alegreya SC', serif; color: var(--gold); }
  .brow .d, .brow .n { color: var(--dim); font-size: 13px; white-space: nowrap; }
  .brow .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .brow:hover, .brow:focus, .brow.on { background: rgba(224,172,62,0.14); outline: none; }
  .brow.sel b::after { content: ' ✓'; }
  .chip.on { background: rgba(120,160,227,0.35); }
</style>
</head>
<body>
<header>
  <h1>Run Stats</h1>
  <span class="views"><button id="vSum" title="Every player together">SUMMARY</button><button id="vOne" title="One player at a time">PLAYERS</button></span>
  <label class="file">OPEN FILES <input id="files" type="file" accept=".json" multiple hidden></label>
  <button id="server">SERVER</button>
  <button id="local">THIS BROWSER</button>
  <span class="bpick"><button id="buildBtn" aria-haspopup="listbox" aria-expanded="false" title="Pick a build; the pointer on one shows what was in it">ALL BUILDS &#9662;</button><div id="buildList" class="blist" hidden></div></span>
  <label class="chk"><input id="easy" type="checkbox"> with easy mode</label>
  <span class="range"><label for="from">FROM</label><input id="from" type="date"><label for="to">TO</label><input id="to" type="date"><button id="allTime" title="Every date">ALL DATES</button><button id="wkPrev" title="A week back">&#8249;</button><button id="wkThis" title="Monday to Sunday of this week">THIS WEEK</button><button id="wkNext" title="A week on">&#8250;</button><span id="wkName" style="font:13px Alegreya,serif;color:var(--dim)"></span></span>
  <span id="status"></span>
</header>
<main id="main"><div class="empty">Loading…</div></main>
<script src="../js/tuning.js"></script>
<script>
'use strict';
// Names out of the game's own registries, so a renamed boon reads the way the game says it.
const nameOf = (() => {

  return (id) => id == null ? '-' : m[String(id).split(':')[0]] ? m[String(id).split(':')[0]] + (String(id).includes(':') ? ' ' + 'I'.repeat(+String(id).split(':')[1]) : '') : String(id);
})();
const WHO = { clubman: 'Clubman', shieldman: 'Shieldman', butcher: 'Butcher', ogre: 'Ogre', hunter: 'Rifleman', dog: 'Hound', seer: 'Mage', wraith: 'Wraith', ratogre: 'Rat ogre',
  fire: 'Fire', witchfire: 'Witchfire', spike: 'Grating', bomb: 'Bomb', mill: 'Wheel', fall: 'Drop', rifle: 'Stray bullet', spire: 'Rock spire', chandelier: 'Chandelier', poison: 'Poison', powder: 'Spilt powder',
  altar: 'Sacrifice altar', toss: 'Thrower (tossed)', abandon: 'Giving up', shield: 'Shieldman', thrower: 'Thrower', shaman: 'Shaman', warden: 'The Warden', flayed: 'The Flayed', brute: 'Butcher', dive: 'Helldive', fist: 'Thrower', blast: 'Blast' };
const HOW = { wall: 'Wall', body: 'Another body', blade: 'Sword swing', sword: 'Thrown sword', door: 'Door', bomb: 'Bomb', blast: 'Ogre blast', chandelier: 'Chandelier', powder: 'Powder',
  hen: 'Hen', antlers: 'Stag antlers', burn: 'Fire', boom: 'Explosion', poison: 'Poison', fall: 'Drop', mill: 'Wheel', spike: 'Grating', spire: 'Rock spire', headbutt: 'Headbutt',
  club: 'Friendly club', shot: 'Bullet', unmade: 'Unmade', hit: 'Other blow', rock: 'Boulder', barrel: 'Barrel', table: 'Table', crate: 'Crate', weapon: 'Stand of arms', corpse: 'Thrown corpse', dev: 'Dev' };
const who = (k) => { const b = String(k || '?').replace('*', ''); return (WHO[b] || HOW[b] || b) + (String(k).endsWith('*') ? ' (boss)' : ''); };
const how = (k) => HOW[k] || k;
// Sixteen apart (12 Oct 2026: "don't show Other, give the details"): a stack shows every cause by its own colour.
const COLORS = ['#2a78d6', '#eb6834', '#1baf7a', '#eda100', '#e87ba4', '#008300', '#9085e9', '#e34948', '#4fc3d9', '#b8d14a', '#a0522d', '#f2e6c2', '#c04fd0', '#6d8fa8', '#ff9f80', '#7a7a2e', '#8a8780'];
const FLOOR_ORDER = (f) => (f[0] === 'L' ? 0 : 0.5) + parseInt(f.slice(1), 10) * 1 + (f[0] === 'N' ? 0.4 : f[0] === 'T' ? 0.3 : 0);

let REPORTS = [];
// The funnel's steps, by player: { step: { at, build } }, the earliest of every source kept.
const STEPS = Object.create(null);   // every map keyed by what came off the wire has no prototype: a player or key named __proto__ blanked the page
const STEP_NAMES = /^(open|start|death|restart|clear1|win|reach\d{1,2})$/;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// Any shape a file may come in: an array of reports, the stored { log }, or the worker's list.
function reportsOf(x) {
  if (!x) return [];
  if (Array.isArray(x)) return x.flatMap(reportsOf);
  if (x.log) return reportsOf(x.log);
  if (x.results) return reportsOf(x.results);
  if (x.floors && x.id) return [x];
  const p = x.properties || x;
  if (p && p.report) return reportsOf(typeof p.report === 'string' ? JSON.parse(p.report) : p.report);
  return [];
}
// Whatever came in is rebuilt here, field by field, before anything reads it: the worker's address is in
// the game, so a report may be forged, and nothing from it may reach the page as markup or break the count.
// Strings are cut short, numbers must be finite, lists must be lists; anything else is dropped.
const S = (v, n = 40) => typeof v === 'string' && v.length ? v.slice(0, n) : null;
const N = (v) => typeof v === 'number' && Number.isFinite(v) ? v : 0;
const A = (v, n = 300) => Array.isArray(v) ? v.slice(0, n).filter((x) => x && typeof x === 'object') : [];
const O = (v) => v && typeof v === 'object' && !Array.isArray(v) ? v : {};
// A floor's souls at its start (`boons`): ids, up to as many as a goat can hold.
const strs30 = (v) => (Array.isArray(v) ? v : []).slice(0, 40).map((x) => S(x, 30)).filter(Boolean);
// What he did in a room (js/stats.js `roomLeave`), in the order the charts stack them.
const STRAT = ['fight', 'stealth', 'run', 'empty'];
const STRAT_NAME = { fight: 'Fought through', stealth: 'Unseen', run: 'Ran past them', empty: 'Nobody there' };
function sanitize(r) {
  if (!r || typeof r !== 'object') return null;
  const id = S(r.id), player = S(r.player), build = S(r.build, 16), at = N(r.at);
  if (!id || !player || !build || at < 1e12 || at > 4e12) return null;
  const strs = (v, n) => (Array.isArray(v) ? v : []).slice(0, 6).map((x) => S(x, n)).filter(Boolean);
  const floors = A(r.floors, 20).filter((f) => typeof f.f === 'string' && /^[LNT]\d{1,2}$/.test(f.f)).map((f) => ({
    f: f.f, name: S(f.name) || '', cleared: !!f.cleared, kills: N(f.kills), time: N(f.time), room: N(f.room),
    hurt: A(f.hurt).map((h) => ({ by: S(h.by, 24) || '?', n: N(h.n), hp: N(h.hp), room: N(h.room), t: N(h.t) })),
    blows: Object.fromEntries(Object.entries(O(f.blows)).slice(0, 300)
      .filter(([k, v]) => k.length <= 60 && k.includes('|') && Array.isArray(v)).map(([k, v]) => [k, [N(v[0]), N(v[1])]])),
    souls: A(f.souls).map((s) => ({ offer: strs(s.offer, 30), took: s.took === null ? null : S(s.took, 30) || undefined })),
    shop: A(f.shop).map((s) => ({ offer: strs(s.offer, 30), took: S(s.took, 30) })),
    beasts: A(f.beasts).map((b) => ({ kind: S(b.kind, 16) || '?', ev: S(b.ev, 8) || '?', room: N(b.room), t: N(b.t) })),
    rooms: N(f.rooms), boons: strs30(f.boons),
    // Room by room (6 Oct 2026; older reports have none, and every reader below copes with an empty list).
    rm: A(f.rm, 60).filter((x) => STRAT.includes(x.s)).map((x) => ({ i: N(x.i), r: S(x.r, 12) || '?', t: N(x.t), h: N(x.h), k: N(x.k), n: N(x.n), d: N(x.d), a: N(x.a), s: x.s })),
    path: (Array.isArray(f.path) ? f.path : []).slice(0, 120).filter((p) => Array.isArray(p)).map((p) => [N(p[0]), N(p[1])]),
    // SOMETHING NEW (6 Oct 2026, js/stats.js `Novelty`): [floor second, 'section:id', seconds dry before it], the
    // dry seconds on walking in (null on an older report), and what was slipped in because it ran dry.
    nw: (Array.isArray(f.nw) ? f.nw : []).slice(0, 60).filter((p) => Array.isArray(p) && S(p[1], 40)).map((p) => [N(p[0]), S(p[1], 40), N(p[2])]),
    dry: typeof f.dry === 'number' && Number.isFinite(f.dry) ? f.dry : null,
    nudge: (Array.isArray(f.nudge) ? f.nudge : []).slice(0, 12).map((x) => S(x, 40)).filter(Boolean),
  }));

  // when it was last heard of, and `seq` how many times it had been sent (the fuller copy wins in `add`).
  return { id, player, build, at, done: N(r.done) || N(r.upto) || at, upto: N(r.upto), seq: N(r.seq), flags: S(r.flags, 8) || '', release: !!r.release, floors,
    mirror: (Array.isArray(r.mirror) ? r.mirror : []).slice(0, 40).map((x) => S(x, 30)).filter(Boolean),
    heaven: Array.isArray(r.heaven) && r.heaven.length === 2 ? [N(r.heaven[0]), N(r.heaven[1])] : null,   // [visits, seconds] up there before this life
    dryMax: typeof r.dryMax === 'number' && Number.isFinite(r.dryMax) ? r.dryMax : null, dryEnd: typeof r.dryEnd === 'number' && Number.isFinite(r.dryEnd) ? r.dryEnd : null,
    end: { how: S(E.how, 8) || '?', f: S(E.f, 4), by: S(E.by, 24), kills: N(E.kills), t: N(E.t), room: N(E.room), code: S(E.code, 120),
      role: S(E.role, 12), rooms: N(E.rooms) } };
}
// Steps in any shape they come: the worker's rows, this browser's store, a SAVE STATS file.
function stepsOf(x) {
  if (!x || typeof x !== 'object') return [];
  if (Array.isArray(x)) return x.flatMap(stepsOf);
  if (typeof x.step === 'string') return [{ player: x.player, step: x.step, at: x.at, build: x.build }];
  if (x.steps && typeof x.steps === 'object' && !Array.isArray(x.steps))

}
function addSteps(list) {

    if (!player || !step || !STEP_NAMES.test(step) || at < 1e12 || at > 4e12) continue;
    const P = STEPS[player] = STEPS[player] || Object.create(null);

// How whole a copy of a life is, as the worker weighs it (tools/stats-worker/worker.js `wholeness`): an ending over a
// copy sent while it was still being played, then the later of those sends, then more floors, then more play.
const wholeness = (r) => [r.end.how !== 'on' ? 1 : 0, r.seq || 0, r.floors.length, r.floors.reduce((n, F) => n + F.time, 0)];

// again each time it is sent: the fullest copy of each id is kept, whichever source brought it.
function add(list, label) {
  const at = new Map(REPORTS.map((r, i) => [r.id, i]));
  let n = 0, up = 0, bad = 0, newest = 0;
  for (const raw of list) {
    let r = null; try { r = sanitize(raw); } catch (e) { r = null; }
    if (!r) { bad++; continue; }
    newest = Math.max(newest, r.done || r.at);
    const i = at.get(r.id);
    if (i === undefined) { at.set(r.id, REPORTS.length); REPORTS.push(r); n++; }
    else if (fuller(REPORTS[i], r)) { REPORTS[i] = r; up++; }
  }

  $('status').textContent = `${REPORTS.length} lives · ${n} new from ${label}` + (up ? ` · ${up} brought up to date` : '')
    + (newest ? ` · its newest ${new Date(newest).toLocaleString([], { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}` : '')
    + (bad ? ` · ${bad} malformed, skipped` : '');
  builds(); draw();
}
function fromLocal() {
  try { const d = JSON.parse(localStorage.getItem('goatout.stats.v1') || 'null'); addSteps(stepsOf(d)); add(reportsOf(d), 'this browser'); }
  catch (e) { $('status').textContent = 'this browser holds none'; }
}
$('local').onclick = fromLocal;
// The worker: its address and READ_KEY, asked once and kept here (never in the game, never in git).
const SRV_KEY = 'goatout.stats.server';
// What the server gave last, kept in this browser (13 Oct 2026, "load every session from the server, and only then cut
// it by the dates"): IndexedDB, since a few thousand lives outgrow localStorage. It is laid in when the page opens, and
// the server is asked again at once if its key is kept here. SERVER always fetches the whole of it, every page back to
// the first life; FROM / TO only ever filter what is loaded (`draw`), they never choose what is fetched.
const CACHE_DB = 'goatout.stats.cache';
function cacheDb() {
  return new Promise((ok, no) => {
    if (typeof indexedDB === 'undefined') { no(new Error('no IndexedDB')); return; }
    const q = indexedDB.open(CACHE_DB, 1);
    q.onupgradeneeded = () => q.result.createObjectStore('kv');
    q.onsuccess = () => ok(q.result); q.onerror = () => no(q.error);
  });
}
async function cacheIo(key, val) {
  const db = await cacheDb();
  return new Promise((ok, no) => {
    const st = db.transaction('kv', val === undefined ? 'readonly' : 'readwrite').objectStore('kv');
    const q = val === undefined ? st.get(key) : st.put(val, key);
    q.onsuccess = () => ok(q.result); q.onerror = () => no(q.error);
  });
}
async function fromCache() {
  try {
    const c = await cacheIo('server');
    if (!c || !Array.isArray(c.reports)) return;

function playersSection(R, clean) {
  const ids = [...new Set(R.map((r) => r.player))];
  const rows = ids.map((id) => { const L = R.filter((r) => r.player === id); return { id, sk: skillOf(clean, id), p: playerFacts(L) }; }).sort((a, b) => b.p.last - a.p.last);
  const n = { new: 0, beginner: 0, middle: 0, pro: 0 }; for (const x of rows) n[x.sk.tag]++;
  const filter = `<select id="tagf"><option value="">CHARTS: EVERY PLAYER</option>${['pro', 'middle', 'beginner', 'new'].map((t) => `<option value="${t}"${TAGF === t ? ' selected' : ''}>CHARTS: ${TAG_NAME[t]} ONLY (${n[t]})</option>`).join('')}</select>`;
  return `<div class="grid"><section class="wide"><h2>Players</h2><p class="sub">Every player in these dates, last seen first. The tag is read off all his lives:
    how far he gets, how often he dies for it, how fast a floor goes, and how many ways he has learned to kill. Click a player to see his own history.
    ${['pro', 'middle', 'beginner', 'new'].map((t) => tagHtml(t) + ' ' + n[t]).join(' &nbsp; ')} &nbsp; ${filter}</p>
    <div class="scroll" style="max-height:420px"><table><tr><th>Player</th><th>Tag</th><th class="n">Score</th><th class="n">Lives</th><th class="n">Escapes</th><th>Best floor</th>
    <th class="n">Floors cleared</th><th class="n">Deaths</th><th class="n">A floor takes</th><th class="n">Played</th><th class="n">Ways to kill</th><th class="n">In heaven</th><th class="n">Animals out</th><th>Last seen</th></tr>` +
    rows.map(({ id, sk, p }) => `<tr class="pick" data-player="${esc(id)}" title="${esc(id)}"><td>${esc(id.slice(0, 10))}</td><td>${tagHtml(sk.tag)}</td><td class="n">${sk.score}</td><td class="n">${p.lives}</td>
      <td class="n">${p.wins || ''}</td><td>${esc(p.bestF)}</td><td class="n">${p.cleared}</td><td class="n">${p.deaths}</td><td class="n">${p.clearT.length ? mmss(med(p.clearT)) : ''}</td>
      <td class="n">${mmss(p.play)}</td><td class="n">${p.hows.size}</td><td class="n">${p.heaven[0] ? mmss(p.heaven[1] / p.heaven[0]) + ' × ' + p.heaven[0] : ''}</td>
      <td class="n">${p.beasts.here ? p.beasts.freed + '/' + p.beasts.here : ''}</td><td>${dayOf(p.last)}</td></tr>`).join('') + '</table></div></section></div>';
}
// PLAYERS: the picker, his card, every life of his as a row, and every chart for him alone.
function playerView(R, clean) {
  const ids = [...new Set(R.map((r) => r.player))];
  if (!ids.length) return '<div class="empty">No players in these dates.</div>';
  const last = Object.create(null); for (const r of R) last[r.player] = Math.max(last[r.player] || 0, r.done || r.at);
  ids.sort((a, b) => last[b] - last[a]);
  if (!ids.includes(PICK)) PICK = ids[0];
  const at = ids.indexOf(PICK), L = R.filter((r) => r.player === PICK).sort((a, b) => b.at - a.at);
  const sk = skillOf(clean, PICK), p = playerFacts(L), P = sk.parts;
  const opt = ids.map((id) => { const s = skillOf(clean, id); return `<option value="${esc(id)}"${id === PICK ? ' selected' : ''}>${TAG_NAME[s.tag]} · ${esc(id.slice(0, 10))} · ${R.filter((r) => r.player === id).length} lives · ${dayOf(last[id])}</option>`; }).join('');
  const bar = `<div class="pbar"><button data-player="${esc(ids[(at - 1 + ids.length) % ids.length])}" title="The player before">&#8249;</button>
    <select id="ppick">${opt}</select><button data-player="${esc(ids[(at + 1) % ids.length])}" title="The next player">&#8250;</button>
    <span style="color:var(--dim)">player ${at + 1} of ${ids.length}, last seen first · <span title="${esc(PICK)}">${esc(PICK)}</span></span></div>`;
  const why = `<p class="sub">Score <b>${sk.score}</b> of 100, off all his lives: progress ${Math.round(P.prog)}/40 (best ${esc(sk.facts.bestF)}${sk.facts.wins ? ', escaped ' + sk.facts.wins + '×' : ''}),
    survival ${Math.round(P.surv)}/25 (${sk.facts.cleared} floors cleared for ${sk.facts.deaths} deaths), pace ${Math.round(P.pace)}/15
    (${sk.facts.clearT.length ? mmss(med(sk.facts.clearT)) + ' a cleared floor' : 'no floor cleared'}), mechanics ${Math.round(P.mech)}/20
    (${sk.facts.hows.size} ways to kill: ${esc([...sk.facts.hows].map(how).join(', ') || 'none')}${sk.facts.rooms ? '; ' + Math.round(100 * sk.facts.stealth / sk.facts.rooms) + '% of rooms unseen' : ''}).
    ${TAG_AT.middle} makes MIDDLE, ${TAG_AT.pro} makes PRO.</p>`;
  const tiles = [[p.lives, 'lives'], [p.wins, 'escapes'], [p.bestF, 'best floor'], [mmss(p.play), 'played in all (floor clocks)'],
    [p.days.size, p.days.size === 1 ? 'day' : 'days he played'], [dayOf(p.first), 'first seen'],
    [p.heaven[0] ? mmss(p.heaven[1] / p.heaven[0]) : '-', `in heaven a visit (${p.heaven[0]} visits, ${mmss(p.heaven[1])} in all)`],
    [p.beasts.here ? p.beasts.freed + ' / ' + p.beasts.here : '-', `animals let out of those met, ${p.beasts.saved} brought to the stairs`]];
  const lives = '<div class="scroll"><table><tr><th>When</th><th>Build</th><th>Floors</th><th class="n">Run</th><th>Ended</th><th class="n">Kills</th><th>Souls taken</th><th>Mirror before it</th><th class="n">Heaven before it</th><th>Animals</th></tr>' +
    L.map((r) => {
      const E = r.end || {}, fl = r.floors.map((F, i) => `<span class="chip ${F.cleared ? 'ok' : i === r.floors.length - 1 && E.how === 'death' ? 'died' : stillOn(r, F) ? 'on' : 'left'}" title="${esc(F.name || F.f)}: ${mmss(F.time)}, ${F.kills} kills">${esc(F.f)}</span>`).join('');
      const souls = r.floors.flatMap((F) => F.souls.filter((s) => s.took).map((s) => nameOf(s.took)));
      const an = r.floors.flatMap((F) => F.beasts.filter((b) => b.ev === 'freed' || b.ev === 'saved').map((b) => b.kind + (b.ev === 'saved' ? ' ✓' : '')));
      return `<tr><td>${new Date(r.at).toLocaleString()}</td><td>${esc(r.build)}</td><td>${fl}</td><td class="n">${mmss(r.floors.reduce((n, F) => n + F.time, 0))}</td>
        <td>${esc(endWord(E.how))}${E.how === 'on' && r.upto ? ' (last heard ' + esc(new Date(r.upto).toLocaleString()) + ')' : ''}${E.by ? ' · ' + esc(who(E.by)) : ''}${E.f ? ' · ' + esc(E.f) + ' room ' + (N(E.room) + 1) : ''}</td><td class="n">${N(E.kills)}</td>
        <td>${esc(souls.join(', '))}</td><td>${esc((r.mirror || []).map((m) => { const [id, rk] = m.split(':'); return mirrorName(id, +rk || 1); }).join(', '))}</td>
        <td class="n">${r.heaven ? mmss(r.heaven[1]) + (r.heaven[0] > 1 ? ' (' + r.heaven[0] + ')' : '') : ''}</td><td>${esc(an.join(', '))}</td></tr>`;
    }).join('') + '</table></div>';
  return bar + `<div class="grid"><section class="wide"><h2>${tagHtml(sk.tag, true)} &nbsp; ${esc(PICK.slice(0, 10))}</h2>${why}
    <div class="tiles">${tiles.map(([v, l]) => `<div class="tile"><b>${esc(v)}</b><span>${esc(l)}</span></div>`).join('')}</div></section>
    <section class="wide"><h2>His lives</h2><p class="sub">Newest first. A floor in green he cleared, in red he died on, in grey he left, in blue he was still on when the life was last sent (STILL PLAYING: no ending has come in yet). The mirror and heaven columns are what he did up there before that life began.</p>${lives}</section></div>
    <h2 style="margin:18px 0 8px">Everything else, for him alone</h2>` + body(L);
}

fromLocal();
if (!REPORTS.length) { builds(); draw(); }
// What was in each build (CHANGELOG.md), the server's last copy, then the server itself if its key is kept here.
loadChanges();
fromCache().then(() => fromServer(false, true));
</script>
</body>
</html>
