<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Run Stats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@400;700&family=Alegreya+SC:wght@700&display=swap" rel="stylesheet">
<style>
  /* RUN STATS: every life's report (js/stats.js), read out of this browser (served from the game's own
     origin), out of files (the dev drawer's SAVE STATS), or off our own worker (tools/stats-worker):
     SERVER asks its address and the READ_KEY once and keeps them in this browser only. No dependencies: the bars are SVG drawn here.
     THE FUNNEL is the players, not the lives: each step's first time (`Stats.step`), plus what the lives say. */
  :root { --bg: #16121c; --panel: #221b2c; --ink: #efe6d0; --dim: rgba(239,230,208,0.6); --gold: #f7d774; --line: rgba(239,230,208,0.14); }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 Alegreya, Georgia, serif; }
  header { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 2px solid #e0ac3e; padding: 12px 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  h1 { font: 700 22px 'Alegreya SC', serif; color: var(--gold); margin: 0 12px 0 0; }
  button, select, label.file { font: 700 13px 'Alegreya SC', serif; background: rgba(247,215,116,0.12); color: var(--ink); border: 1px solid #e0ac3e; padding: 6px 12px; cursor: pointer; }
  select option { background: var(--panel); }
  label.chk { font-size: 13px; color: var(--dim); display: flex; gap: 4px; align-items: center; }
  #status { color: var(--dim); font-size: 13px; }
  main { max-width: 1180px; margin: 0 auto; padding: 16px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .tile { background: var(--panel); padding: 10px 14px; }
  .tile b { display: block; font: 700 28px 'Alegreya SC', serif; color: var(--gold); }
  .tile span { color: var(--dim); font-size: 13px; }
  .funnel { margin-bottom: 14px; }
  .funnel table td { padding: 5px 6px; }
  .funnel .fb { height: 18px; background: #e0ac3e; display: block; min-width: 2px; }
  .funnel td.lab { width: 32%; } .funnel td.track { width: 40%; }
  .funnel td.drop { color: var(--dim); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(520px, 100%), 1fr)); gap: 14px; }
  section { background: var(--panel); padding: 12px 14px; border-left: 3px solid #e0ac3e; min-width: 0; }
  section h2 { font: 700 15px 'Alegreya SC', serif; margin: 0 0 4px; color: var(--gold); }
  section p.sub { margin: 0 0 8px; color: var(--dim); font-size: 13px; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; color: var(--dim); margin-bottom: 6px; }
  .legend i { display: inline-block; width: 10px; height: 10px; margin-right: 4px; vertical-align: -1px; }
  svg { width: 100%; height: auto; display: block; }
  svg text { fill: rgba(239,230,208,0.7); font: 12px Alegreya, serif; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { text-align: left; font: 700 12.5px 'Alegreya SC', serif; color: var(--dim); border-bottom: 1px solid var(--line); padding: 4px 6px; }
  td { padding: 3px 6px; border-bottom: 1px solid var(--line); }
  td.n { text-align: right; font-variant-numeric: tabular-nums; }
  .bar { height: 8px; background: #e0ac3e; display: inline-block; vertical-align: middle; }
  .scroll { max-height: 420px; overflow: auto; }
  .empty { color: var(--dim); padding: 30px; text-align: center; }
  details { margin-top: 6px; } summary { cursor: pointer; color: var(--dim); font-size: 13px; }
  /* The date range (6 Oct 2026): every chart, table and the funnel read only what falls inside it. */
  .range { display: flex; gap: 6px; align-items: center; padding: 3px 8px; border: 1px solid rgba(224,172,62,0.5); }
  .range label { font: 700 13px 'Alegreya SC', serif; color: var(--gold); }
  .range input { font: 14px Alegreya, serif; background: var(--panel); color: var(--ink); border: 1px solid #e0ac3e; padding: 4px 6px; color-scheme: dark; }
  .range.on { background: rgba(247,215,116,0.14); border-color: #e0ac3e; }
  /* Floor by room grids: a cell's shade is its share of the grid's largest value. */
  table.rg td, table.rg th { text-align: center; padding: 3px 2px; min-width: 26px; font-size: 13px; }
  table.rg td.f { text-align: left; white-space: nowrap; padding-right: 8px; }
  table.rg td.x { color: rgba(239,230,208,0.25); }
  pre { white-space: pre-wrap; font: 12px/1.35 ui-monospace, Consolas, monospace; color: var(--dim); max-height: 300px; overflow: auto; }
</style>
</head>
<body>
<header>
  <h1>Run Stats</h1>
  <label class="file">OPEN FILES <input id="files" type="file" accept=".json" multiple hidden></label>
  <button id="server">SERVER</button>
  <button id="local">THIS BROWSER</button>
  <select id="build"></select>
  <label class="chk"><input id="easy" type="checkbox"> with easy mode</label>
  <span class="range"><label for="from">FROM</label><input id="from" type="date"><label for="to">TO</label><input id="to" type="date"><button id="allTime" title="Every date">ALL DATES</button></span>
  <span id="status"></span>
</header>
<main id="main"><div class="empty">Loading…</div></main>
<script src="../js/tuning.js"></script>
<script>
'use strict';
// Names out of the game's own registries, so a renamed boon reads the way the game says it.
const nameOf = (() => {
  const m = {};
  try { for (const b of BOONS) m[b.id] = b.name; } catch (e) {}
  try { for (const a of ARTIFACTS) m[a.id] = a.name; } catch (e) {}
  try { for (const c of CAPES) m[c.id] = c.name; } catch (e) {}   // a cape is its id alone (6 Oct 2026); boomerang, symbols, effigy were talismans before
  return (id) => id == null ? '-' : m[String(id).split(':')[0]] ? m[String(id).split(':')[0]] + (String(id).includes(':') ? ' ' + 'I'.repeat(+String(id).split(':')[1]) : '') : String(id);
})();
const WHO = { clubman: 'Clubman', shieldman: 'Shieldman', butcher: 'Butcher', ogre: 'Ogre', hunter: 'Rifleman', dog: 'Hound', seer: 'Mage', wraith: 'Wraith', ratogre: 'Rat ogre',
  fire: 'Fire', witchfire: 'Witchfire', spike: 'Grating', bomb: 'Bomb', mill: 'Wheel', fall: 'Drop', rifle: 'Stray bullet', spire: 'Rock spire', chandelier: 'Chandelier', poison: 'Poison', powder: 'Spilt powder' };
const HOW = { wall: 'Wall', body: 'Another body', blade: 'Sword swing', sword: 'Thrown sword', door: 'Door', bomb: 'Bomb', blast: 'Ogre blast', chandelier: 'Chandelier', powder: 'Powder',
  hen: 'Hen', antlers: 'Stag antlers', burn: 'Fire', boom: 'Explosion', poison: 'Poison', fall: 'Drop', mill: 'Wheel', spike: 'Grating', spire: 'Rock spire', headbutt: 'Headbutt',
  club: 'Friendly club', shot: 'Bullet', unmade: 'Unmade', hit: 'Other blow', rock: 'Boulder', barrel: 'Barrel', table: 'Table', crate: 'Crate', weapon: 'Stand of arms', corpse: 'Thrown corpse', dev: 'Dev' };
const who = (k) => { const b = String(k || '?').replace('*', ''); return (WHO[b] || HOW[b] || b) + (String(k).endsWith('*') ? ' (boss)' : ''); };
const how = (k) => HOW[k] || k;
const COLORS = ['#2a78d6', '#eb6834', '#1baf7a', '#eda100', '#e87ba4', '#008300', '#9085e9', '#e34948', '#8a8780'];
const FLOOR_ORDER = (f) => (f[0] === 'L' ? 0 : 0.5) + parseInt(f.slice(1), 10) * 1 + (f[0] === 'N' ? 0.4 : f[0] === 'T' ? 0.3 : 0);

let REPORTS = [];
// The funnel's steps, by player: { step: { at, build } }, the earliest of every source kept.
const STEPS = Object.create(null);   // every map keyed by what came off the wire has no prototype: a player or key named __proto__ blanked the page
const STEP_NAMES = /^(open|start|death|restart|clear1|win|reach\d{1,2})$/;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// Any shape a file may come in: an array of reports, the stored { log }, or the worker's list.
function reportsOf(x) {
  if (!x) return [];
  if (Array.isArray(x)) return x.flatMap(reportsOf);
  if (x.log) return reportsOf(x.log);
  if (x.results) return reportsOf(x.results);
  if (x.floors && x.id) return [x];
  const p = x.properties || x;
  if (p && p.report) return reportsOf(typeof p.report === 'string' ? JSON.parse(p.report) : p.report);
  return [];
}
// Whatever came in is rebuilt here, field by field, before anything reads it: the worker's address is in
// the game, so a report may be forged, and nothing from it may reach the page as markup or break the count.
// Strings are cut short, numbers must be finite, lists must be lists; anything else is dropped.
const S = (v, n = 40) => typeof v === 'string' && v.length ? v.slice(0, n) : null;
const N = (v) => typeof v === 'number' && Number.isFinite(v) ? v : 0;
const A = (v, n = 300) => Array.isArray(v) ? v.slice(0, n).filter((x) => x && typeof x === 'object') : [];
const O = (v) => v && typeof v === 'object' && !Array.isArray(v) ? v : {};
// A floor's souls at its start (`boons`): ids, up to as many as a goat can hold.
const strs30 = (v) => (Array.isArray(v) ? v : []).slice(0, 40).map((x) => S(x, 30)).filter(Boolean);
// What he did in a room (js/stats.js `roomLeave`), in the order the charts stack them.
const STRAT = ['fight', 'stealth', 'run', 'empty'];
const STRAT_NAME = { fight: 'Fought through', stealth: 'Unseen', run: 'Ran past them', empty: 'Nobody there' };
function sanitize(r) {
  if (!r || typeof r !== 'object') return null;
  const id = S(r.id), player = S(r.player), build = S(r.build, 16), at = N(r.at);
  if (!id || !player || !build || at < 1e12 || at > 4e12) return null;
  const strs = (v, n) => (Array.isArray(v) ? v : []).slice(0, 6).map((x) => S(x, n)).filter(Boolean);
  const floors = A(r.floors, 20).filter((f) => typeof f.f === 'string' && /^[LNT]\d{1,2}$/.test(f.f)).map((f) => ({
    f: f.f, name: S(f.name) || '', cleared: !!f.cleared, kills: N(f.kills), time: N(f.time), room: N(f.room),
    hurt: A(f.hurt).map((h) => ({ by: S(h.by, 24) || '?', n: N(h.n), hp: N(h.hp), room: N(h.room), t: N(h.t) })),
    blows: Object.fromEntries(Object.entries(O(f.blows)).slice(0, 300)
      .filter(([k, v]) => k.length <= 60 && k.includes('|') && Array.isArray(v)).map(([k, v]) => [k, [N(v[0]), N(v[1])]])),
    souls: A(f.souls).map((s) => ({ offer: strs(s.offer, 30), took: s.took === null ? null : S(s.took, 30) || undefined })),
    shop: A(f.shop).map((s) => ({ offer: strs(s.offer, 30), took: S(s.took, 30) })),
    beasts: A(f.beasts).map((b) => ({ kind: S(b.kind, 16) || '?', ev: S(b.ev, 8) || '?', room: N(b.room), t: N(b.t) })),
    rooms: N(f.rooms), boons: strs30(f.boons),
    // Room by room (6 Oct 2026; older reports have none, and every reader below copes with an empty list).
    rm: A(f.rm, 60).filter((x) => STRAT.includes(x.s)).map((x) => ({ i: N(x.i), r: S(x.r, 12) || '?', t: N(x.t), h: N(x.h), k: N(x.k), n: N(x.n), d: N(x.d), a: N(x.a), s: x.s })),
    path: (Array.isArray(f.path) ? f.path : []).slice(0, 120).filter((p) => Array.isArray(p)).map((p) => [N(p[0]), N(p[1])]),
    // SOMETHING NEW (6 Oct 2026, js/stats.js `Novelty`): [floor second, 'section:id', seconds dry before it], the
    // dry seconds on walking in (null on an older report), and what was slipped in because it ran dry.
    nw: (Array.isArray(f.nw) ? f.nw : []).slice(0, 60).filter((p) => Array.isArray(p) && S(p[1], 40)).map((p) => [N(p[0]), S(p[1], 40), N(p[2])]),
    dry: typeof f.dry === 'number' && Number.isFinite(f.dry) ? f.dry : null,
    nudge: (Array.isArray(f.nudge) ? f.nudge : []).slice(0, 12).map((x) => S(x, 40)).filter(Boolean),
  }));
  if (!floors.length) return null;
  const E = O(r.end);
  return { id, player, build, at, done: N(r.done) || at, flags: S(r.flags, 8) || '', release: !!r.release, floors,
    mirror: (Array.isArray(r.mirror) ? r.mirror : []).slice(0, 40).map((x) => S(x, 30)).filter(Boolean),
    dryMax: typeof r.dryMax === 'number' && Number.isFinite(r.dryMax) ? r.dryMax : null, dryEnd: typeof r.dryEnd === 'number' && Number.isFinite(r.dryEnd) ? r.dryEnd : null,
    end: { how: S(E.how, 8) || '?', f: S(E.f, 4), by: S(E.by, 24), kills: N(E.kills), t: N(E.t), room: N(E.room), code: S(E.code, 120),
      role: S(E.role, 12), rooms: N(E.rooms) } };
}
// Steps in any shape they come: the worker's rows, this browser's store, a SAVE STATS file.
function stepsOf(x) {
  if (!x || typeof x !== 'object') return [];
  if (Array.isArray(x)) return x.flatMap(stepsOf);
  if (typeof x.step === 'string') return [{ player: x.player, step: x.step, at: x.at, build: x.build }];
  if (x.steps && typeof x.steps === 'object' && !Array.isArray(x.steps))
    return Object.entries(x.steps).map(([k, v]) => ({ player: x.player, step: k, at: v && v.at, build: v && v.build }));
  return [];
}
function addSteps(list) {
  let n = 0;
  for (const raw of list) {
    const player = S(raw.player), step = S(raw.step, 12), at = N(raw.at), build = S(raw.build, 16) || '?';
    if (!player || !step || !STEP_NAMES.test(step) || at < 1e12 || at > 4e12) continue;
    const P = STEPS[player] = STEPS[player] || Object.create(null);
    if (!P[step] || P[step].at > at) { P[step] = { at, build }; n++; }
  }
  return n;
}
function add(list, label) {
  const seen = new Set(REPORTS.map((r) => r.id));
  let n = 0, bad = 0;
  for (const raw of list) {
    let r = null; try { r = sanitize(raw); } catch (e) { r = null; }
    if (!r) { bad++; continue; }
    if (!seen.has(r.id)) { REPORTS.push(r); seen.add(r.id); n++; }
  }
  $('status').textContent = `${REPORTS.length} lives · ${n} new from ${label}` + (bad ? ` · ${bad} malformed, skipped` : '');
  builds(); draw();
}
function fromLocal() {
  try { const d = JSON.parse(localStorage.getItem('goatout.stats.v1') || 'null'); addSteps(stepsOf(d)); add(reportsOf(d), 'this browser'); }
  catch (e) { $('status').textContent = 'this browser holds none'; }
}
$('local').onclick = fromLocal;
// The worker: its address and READ_KEY, asked once and kept here (never in the game, never in git).
const SRV_KEY = 'goatout.stats.server';
async function fromServer(ask) {
  let srv = null;
  try { srv = JSON.parse(localStorage.getItem(SRV_KEY) || 'null'); } catch (e) {}
  if (!srv || ask) {
    const url = prompt('Worker address (https://goat-stats.<you>.workers.dev):', srv ? srv.url : (typeof TUNING !== 'undefined' && TUNING.stats && TUNING.stats.url) || '');
    if (!url) return;
    const key = prompt('READ_KEY:', srv ? srv.key : '');
    if (!key) return;
    srv = { url: url.trim().replace(/\/$/, ''), key: key.trim() };
    localStorage.setItem(SRV_KEY, JSON.stringify(srv));
  }
  $('status').textContent = 'asking the server…';
  try {
    // Newest first, a page of 5000 at a time, walked back until a short page (a worker from before
    // the paging has no X-Oldest-Got and gives its one page as it always did).
    const head = { Authorization: 'Bearer ' + srv.key };
    let got = [], before = 0;
    for (let page = 0; page < 40; page++) {
      const r = await fetch(srv.url + '/reports' + (before ? '?before=' + before : ''), { headers: head });
      if (r.status === 401) { $('status').textContent = 'the server refused the key'; return fromServer(true); }
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const part = await r.json(), oldest = +r.headers.get('X-Oldest-Got') || 0;
      got = got.concat(part);
      $('status').textContent = 'asking the server… ' + got.length;
      if (part.length < 5000 || !oldest || oldest === before) break;
      before = oldest;
    }
    // The steps are their own table; a worker from before them answers 404, and the funnel is then the lives' alone.
    try { const s = await fetch(srv.url + '/steps', { headers: head }); if (s.ok) addSteps(stepsOf(await s.json())); } catch (e) {}
    add(reportsOf(got), 'the server');
  } catch (e) { $('status').textContent = 'server: ' + e.message; }
}
$('server').onclick = (e) => fromServer(e.shiftKey);
$('files').onchange = async (e) => { for (const f of e.target.files) { try { const x = JSON.parse(await f.text()); addSteps(stepsOf(x)); add(reportsOf(x), f.name); } catch (err) { $('status').textContent = f.name + ': not a stats file'; } } };
document.addEventListener('dragover', (e) => e.preventDefault());
document.addEventListener('drop', async (e) => { e.preventDefault(); for (const f of e.dataTransfer.files) { try { const x = JSON.parse(await f.text()); addSteps(stepsOf(x)); add(reportsOf(x), f.name); } catch (err) {} } });
$('build').onchange = draw; $('easy').onchange = draw;
// The dates to look at (6 Oct 2026: "let me pick from when to look"): FROM and TO are whole days in this
// browser's own time, either may be empty, and the pick is kept in this browser.
const RANGE_KEY = 'goatout.stats.range';
function rangeOf() {
  const day = (v, end) => { if (!v) return null; const t = new Date(v + (end ? 'T23:59:59.999' : 'T00:00:00')).getTime(); return Number.isFinite(t) ? t : null; };
  const from = day($('from').value, false), to = day($('to').value, true);
  return { from, to, on: from != null || to != null, has: (t) => (from == null || t >= from) && (to == null || t <= to) };
}
function rangeSaved() {
  try { localStorage.setItem(RANGE_KEY, JSON.stringify({ from: $('from').value, to: $('to').value })); } catch (e) {}
}
try { const g = JSON.parse(localStorage.getItem(RANGE_KEY) || 'null'); if (g) { $('from').value = g.from || ''; $('to').value = g.to || ''; } } catch (e) {}
$('from').onchange = $('to').onchange = () => { rangeSaved(); draw(); };
$('allTime').onclick = () => { $('from').value = ''; $('to').value = ''; rangeSaved(); draw(); };
function builds() {
  const cur = $('build').value;
  const bs = [...new Set(REPORTS.map((r) => r.build).concat(Object.values(STEPS).flatMap((o) => Object.values(o).map((v) => v.build))))].sort();
  $('build').innerHTML = '<option value="">ALL BUILDS</option>' + bs.map((b) => `<option value="${esc(b)}">${esc(b)}</option>`).join('');
  $('build').value = bs.includes(cur) ? cur : '';
}

// ---------- the counting ----------
const inc = (o, a, b, n = 1) => { (o[a] = o[a] || Object.create(null))[b] = (o[a][b] || 0) + n; };
function count(R) {
  const C = { lives: R.length, players: new Set(R.map((r) => r.player)).size, deaths: Object.create(null), hurt: Object.create(null), kills: Object.create(null), blows: Object.create(null), wins: 0,
    souls: Object.create(null), soulFloor: Object.create(null), released: 0, shop: Object.create(null), milk: 0, ogre: 0, beasts: Object.create(null), floorsReached: Object.create(null), cleared: Object.create(null), lifeTime: 0 };
  for (const r of R) {
    const E = r.end || {};
    if (E.how === 'win') C.wins++;
    if (E.how === 'death') inc(C.deaths, E.f || '?', E.by || '?');
    C.lifeTime += E.t || 0;
    for (const F of r.floors || []) {
      C.floorsReached[F.f] = (C.floorsReached[F.f] || 0) + 1;
      if (F.cleared) C.cleared[F.f] = (C.cleared[F.f] || 0) + 1;
      for (const h of F.hurt || []) inc(C.hurt, F.f, h.by, h.n);
      for (const [k, [n, kills]] of Object.entries(F.blows || {})) {
        const [enemy, hw] = k.split('|');
        if (hw === 'dev') continue;
        if (kills) inc(C.kills, F.f, hw, kills);
        const b = C.blows[hw] = C.blows[hw] || { blows: 0, kills: 0, by: Object.create(null) };
        b.blows += n; b.kills += kills; b.by[enemy.replace('*', '')] = (b.by[enemy.replace('*', '')] || 0) + kills;
      }
      for (const s of F.souls || []) {
        for (const id of s.offer) { const o = C.souls[id] = C.souls[id] || { offered: 0, taken: 0 }; o.offered++; if (s.took === id) o.taken++; }
        if (s.took) inc(C.soulFloor, F.f, s.took);
        if (s.took === null) C.released++;
      }
      for (const s of F.shop || []) {
        if (s.took === 'ratogre') { C.ogre++; continue; }
        if (s.took === 'milk') C.milk++;
        for (const id of s.offer || []) { if (id === 'milk') continue; const k = id.split(':')[0]; const o = C.shop[k] = C.shop[k] || { offered: 0, taken: 0 }; o.offered++; if (s.took === id) o.taken++; }
      }
      for (const b of F.beasts || []) { const o = C.beasts[b.kind] = C.beasts[b.kind] || Object.create(null); o[b.ev] = (o[b.ev] || 0) + 1; }
    }
  }
  return C;
}

// ---------- drawing ----------
// Stacked columns, one a floor; the stack's parts beyond the top `keep` fold into "Other".
function stacked(byFloor, opts = {}) {
  const floors = Object.keys(byFloor).sort(opts.order || ((a, b) => FLOOR_ORDER(a) - FLOOR_ORDER(b)));
  if (!floors.length) return '<div class="empty">Nothing yet.</div>';
  const totals = Object.create(null);
  for (const f of floors) for (const [k, n] of Object.entries(byFloor[f])) totals[k] = (totals[k] || 0) + n;
  const keys = Object.keys(totals).sort((a, b) => totals[b] - totals[a]);

  const F = r.floors[r.floors.length - 1];
  if (!F || !F.path.length) return '';
  const st = Object.create(null); for (const x of F.rm) st[x.i] = x.s[0].toUpperCase();
  return ' · path ' + F.path.map(([i]) => (i + 1) + (st[i] || '')).join(' ');
}
// A player's first day is the day of his first life here; any later day he plays he came back.
function byDay(R) {
  const day = (t) => new Date(t).toISOString().slice(5, 10), first = Object.create(null), seen = Object.create(null), out = Object.create(null);
  for (const r of R.slice().sort((a, b) => a.at - b.at)) { if (!(r.player in first)) first[r.player] = day(r.at); }
  for (const r of R) {
    const d = day(r.at), k = r.player + d; if (seen[k]) continue; seen[k] = 1;
    inc(out, d, first[r.player] === d ? 'first' : 'back');
  }
  return out;
}
// ---------- the funnel ----------
const REACH = (typeof TUNING !== 'undefined' && TUNING.stats && TUNING.stats.reach) || [4, 8];
const FUNNEL = [['open', 'Opened the game'], ['start', 'Started a run'], ['death', 'Died for the first time'], ['restart', 'Played again after a death'],
  ['clear1', 'Cleared floor 1']].concat(REACH.map((n) => ['reach' + n, 'Reached floor ' + n]), [['win', 'Escaped']]);
// Each player's steps: what the game sent (`STEPS`), filled in from the lives wherever it sent nothing
// (lives from before the steps existed, a step lost on the way). Anyone with a step opened the game, and
// anyone past it started a run. `R` is every life of every build; `build` keeps the players who came in
// on it (the build of their first step).
// `rg` (the date range) keeps the players whose first step falls inside it, and counts their steps up to its TO.
function funnelOf(R, build, rg) {
  const P = Object.create(null);
  const put = (pl, k, at, b) => { const o = P[pl] = P[pl] || Object.create(null); if (!o[k] || o[k].at > at) o[k] = { at, build: b }; };
  for (const [pl, o] of Object.entries(STEPS)) for (const [k, v] of Object.entries(o)) put(pl, k, v.at, v.build);
  const lives = Object.create(null);
  for (const r of R) (lives[r.player] = lives[r.player] || []).push(r);
  for (const [pl, L] of Object.entries(lives)) {
    let died = false;
    for (const r of L.sort((a, b) => a.at - b.at)) {
      const end = r.done || r.at;
      put(pl, 'start', r.at, r.build);
      if (died) put(pl, 'restart', r.at, r.build);
      for (const F of r.floors) {
        const n = parseInt(F.f.slice(1), 10);
        if (n === 1 && F.cleared) put(pl, 'clear1', end, r.build);
        for (const m of REACH) if (n >= m) put(pl, 'reach' + m, r.at, r.build);
      }
      if (r.end.how === 'death') { died = true; put(pl, 'death', end, r.build); }
      if (r.end.how === 'win') put(pl, 'win', end, r.build);
    }
  }
  const out = Object.create(null); let players = 0;
  for (const o of Object.values(P)) {
    const first = Object.values(o).sort((a, b) => a.at - b.at)[0];
    if (!first || (build && first.build !== build)) continue;
    if (rg && rg.on && !rg.has(first.at)) continue;
    players++;
    const keys = new Set(Object.keys(o).filter((k) => !rg || rg.to == null || o[k].at <= rg.to).concat('open'));
    if ([...keys].some((k) => k !== 'open')) keys.add('start');
    for (const k of keys) out[k] = (out[k] || 0) + 1;
  }
  return { n: out, players };
}
function funnelTable(F) {
  const top = Math.max(1, F.n.open || 0);
  return '<table>' + FUNNEL.map(([k, label], i) => {
    const v = F.n[k] || 0, prev = i ? F.n[FUNNEL[i - 1][0]] || 0 : 0;
    const step = i && prev ? `${Math.round(100 * v / prev)}% of the row above` : '';
    return `<tr><td class="lab">${esc(label)}</td><td class="track"><span class="fb" style="width:${100 * v / top}%"></span></td>` +
      `<td class="n"><b>${v}</b></td><td class="n">${Math.round(100 * v / top)}%</td><td class="drop">${step}</td></tr>`;
  }).join('') + '</table>';
}

const sec = (title, sub, body) => `<section><h2>${title}</h2><p class="sub">${sub}</p>${body}</section>`;

function draw() {
  const b = $('build').value, easy = $('easy').checked;
  const clean = REPORTS.filter((r) => (easy || !/E/.test(r.flags || '')) && !/[XJB]/.test(r.flags || ''));   // B: the autoplay bot
  // The date range: a life by the moment it began, the funnel by each player's first step (`funnelOf`).
  const rg = rangeOf(); $('from').parentNode.classList.toggle('on', rg.on);
  const dates = rg.on ? ` · ${rg.from != null ? 'from ' + esc($('from').value) : 'up'} to ${rg.to != null ? esc($('to').value) : 'today'}` : '';
  const R = clean.filter((r) => (!b || r.build === b) && rg.has(r.at));
  const FN = funnelOf(clean, b, rg);
  const funnel = `<section class="funnel"><h2>The funnel${dates}</h2><p class="sub">${FN.players} players${b ? ' who came in on ' + esc(b) : ''}${rg.on ? ' whose first step falls in these dates' : ''}, each counted once at every step taken.
    Only players who said yes to the title's question are counted (itch.io's own page counts everyone who opened it).
    Dying and clearing floor 1 can come in either order.</p>${funnelTable(FN)}</section>`;
  if (!R.length && FN.players && !(rg.on && clean.length)) { $('main').innerHTML = funnel; return; }
  if (!R.length && rg.on && clean.length) { $('main').innerHTML = funnel + '<div class="empty">No lives in these dates. Press ALL DATES to see every life.</div>'; return; }
  if (!R.length) { $('main').innerHTML = '<div class="empty">No lives here yet. Play one, press THIS BROWSER, or open a file the dev drawer\'s SAVE STATS wrote, or press SERVER.</div>'; return; }
  const C = count(R);
  const deaths = R.filter((r) => r.end && r.end.how === 'death').length;
  const furthest = Object.create(null); for (const r of R) for (const F of r.floors || []) furthest[r.id] = F.f;
  const days = Object.create(null); for (const r of R) (days[r.player] = days[r.player] || new Set()).add(new Date(r.at).toISOString().slice(0, 10));
  const back = Object.values(days).filter((s) => s.size > 1).length;
  const tiles = [[C.lives, 'lives'], [C.players, 'players'], [back, 'players who came back another day'], [deaths, 'deaths'], [C.wins, 'escapes'],
    [Math.round(C.lifeTime / Math.max(1, C.lives)) + 's', 'seconds into the last floor, on average'], [C.released, 'souls released unspent']];
  const dry = R.filter((r) => r.dryMax != null).map((r) => r.dryMax);
  if (dry.length) tiles.push([mmss(med(dry)), 'longest stretch with nothing new in a life (median)']);
  const souls = Object.entries(C.souls).map(([id, o]) => ({ id, ...o })).sort((a, b) => b.taken / b.offered - a.taken / a.offered || b.offered - a.offered);
  const shop = Object.entries(C.shop).map(([id, o]) => ({ id, ...o })).sort((a, b) => b.taken / b.offered - a.taken / a.offered);
  const reach = Object.create(null); for (const [f, n] of Object.entries(C.floorsReached)) reach[f] = { cleared: C.cleared[f] || 0, died: n - (C.cleared[f] || 0) };
  const blows = Object.entries(C.blows).sort((a, b) => b[1].kills - a[1].kills);
  const EV = ['here', 'freed', 'yes', 'no', 'paid', 'saved', 'with', 'dead', 'lost', 'coop'];
  const EVN = { here: 'On the floor', freed: 'Let out', yes: 'Said yes', no: 'Said no', paid: 'Paid early', saved: 'Saved at stairs', with: 'With him at the end', dead: 'Died', lost: 'Left behind', coop: 'Never let out' };
  $('main').innerHTML =
    funnel + '<div class="tiles">' + tiles.map(([v, l]) => `<div class="tile"><b>${esc(v)}</b><span>${esc(l)}</span></div>`).join('') + '</div><div class="grid">' +
    sec('Where the goat dies', 'Deaths on each floor, by what took the last heart.', stacked(C.deaths)) +
    sec('What hurts him', 'Hearts lost on each floor, by what took them.', stacked(C.hurt)) +
    sec('How the cult dies', 'Kills on each floor, by what finished the man.', stacked(C.kills, { name: how })) +
    sec('Players by day', 'Each day: players seen for the first time, and players who came back from an earlier day.', stacked(byDay(R), { order: (a, b) => a < b ? -1 : 1, name: (k) => k === 'first' ? 'First day' : 'Came back' })) +
    sec('How far lives get', 'Each floor: walked onto and cleared, or walked onto and died on.', stacked(reach, { name: (k) => k === 'cleared' ? 'Cleared' : 'Died or quit there' })) +
    sec('Which room he dies in', 'Deaths by floor and room number, in the order the floor lays its rooms (room 1 is where he starts it). A dot is a room nobody died in.', deathGrid(R)) +
    sec('Where lives end along the floor', 'Every life that did not escape, by how far into the floor it got: the room it ended in against the floor\'s rooms.', stacked(endsAlong(R), { name: (k) => PART_NAME[k] || k })) +
    sec('What he does in a room', 'The rooms with men in them on each floor, as % of them: fought through (half the room\'s men or more left dead), unseen (none of them ever came after him), or ran past them (left with men after him).', stacked(stratByFloor(R), { name: (k) => STRAT_NAME[k] || k })) +
    sec('Seconds in each room', 'Average seconds spent in each room, by floor and room number, over every visit (a corridor counts to the room behind him).', timeGrid(R)) +
    sec('Rooms, floor by floor', 'Per floor, a life\'s rooms on average: how many it walked into, how many times it went back into one, and what a room cost.', floorRoomTable(R)) +
    sec('Time per floor', 'Per floor: how long a clear takes (on the floor\'s own clock, cards and talk boxes not counted), how many rooms the floor had, and how long the lives that ended there lasted on it.', floorTimeTable(R)) +
    sec('Something new', `How long a player goes without meeting anything for the first time (a room, an enemy, a floor, a soul, an animal, a talisman, a cape, an object), counted in play seconds over every run in that browser. Past ${(typeof TUNING !== 'undefined' && TUNING.novelty ? TUNING.novelty.dry : 240)} s dry the game slips something in: an unseen soul card, unseen rooms and an unseen vault on the next floor, an unseen talisman on the mouse's shelf.`, noveltyTable(R)) +
    sec('What was new, by floor', 'First sightings on each floor, by kind of thing.', stacked(newByFloor(R), { name: (k) => NEW_SEC[k] || k })) +
    sec('Does the new run out?', 'Each player\'s lives in the order he played them: how many new things a minute of play brought, and the longest stretch without one. A falling first column is the game running out of surprises for him.', noveltyByLife(R)) +
    sec('Dry spells','Every stretch of play between two new things, by length. "Still running" is the one a life ended in. ' + drySuggest(R),stacked(gapHist(R), { order: (a, b) => GAPS.findIndex((g) => g[1] === a) - GAPS.findIndex((g) => g[1] === b), name: (k) => k === 'ended' ? 'Ended in something new' : 'Still running at the end' })) +
    sec('Rooms by kind','Every room walked into, by its kind: men in it, what he did there (empty rooms as a share of all, the rest of the rooms with men), and what it cost.', roleTable(R)) +
    sec('Souls taken by floor', 'The card picked at each soul, floor by floor.', stacked(C.soulFloor, { name: nameOf })) +
    sec('Every soul card', 'How often a card was dealt and how often it was the one taken.', rateTable(souls, 'Soul')) +
    sec('Skills against how far', 'Every life counted under each soul it ended wearing: floors cleared on average, and the share of those lives that died. Read it for balance, but a skill taken late has had less time to fail.', skillTable(R)) +
    sec('The mouse', `Talismans on her shelf and how often each was taken. Milk taken ${C.milk} times; the rat ogre called ${C.ogre} times.`, rateTable(shop, 'Talisman')) +
    sec('Companions', 'What became of each animal, counted over every floor it was on.',
      `<div class="scroll"><table><tr><th>Animal</th>${EV.map((e) => `<th class="n">${EVN[e]}</th>`).join('')}</tr>` +
      Object.entries(C.beasts).map(([k, o]) => `<tr><td>${esc(k)}</td>${EV.map((e) => `<td class="n">${o[e] || ''}</td>`).join('')}</tr>`).join('') + '</table></div>') +
    sec('Every way a blow landed', 'All blows on the cult (a two-heart man takes two), and how many of them killed, by whom.',
      `<div class="scroll"><table><tr><th>How</th><th class="n">Blows</th><th class="n">Kills</th><th>Killed most</th></tr>` +
      blows.map(([k, o]) => `<tr><td>${esc(how(k))}</td><td class="n">${o.blows}</td><td class="n">${o.kills}</td><td>${esc(Object.entries(o.by).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([e, n]) => who(e) + ' ' + n).join(', '))}</td></tr>`).join('') + '</table></div>') +
    sec('Every enemy', 'Per kind: hearts it took from him, lives it ended, and how many of it he finished and with how many blows.', enemyTable(R)) +
    sec('Bought in heaven', 'The mirror ranks bought before each life, in the order he bought them.', mirrorTable(R)) +
    sec('Last lives', 'The most recent lives, newest first. Click one to see the whole report. The path is the last floor\'s rooms in the order he walked into them, each marked F fought, S unseen, R ran, E empty.',
      '<div class="scroll">' + R.slice().sort((a, b) => (b.done || b.at) - (a.done || a.at)).slice(0, 30).map((r) => {
        const E = r.end || {}, bd = buildOf(r);
        return `<details><summary>${new Date(r.done || r.at).toLocaleString()} · ${esc(r.build)} · ${esc(E.how || '?')} on ${esc(E.f || '?')} room ${N(E.room) + 1}${E.rooms ? ' of ' + E.rooms : ''}${E.by ? ' · ' + esc(who(E.by)) : ''} · ${bd.cleared} floors cleared · ${N(E.kills)} kills · ${bd.ids.length ? esc(bd.ids.map(nameOf).join(', ')) : 'no souls'}${r.dryMax != null ? ' · longest with nothing new ' + mmss(r.dryMax) : ''}${esc(pathOf(r))}</summary><pre>${esc(JSON.stringify(r, null, 1))}</pre></details>`;
      }).join('') + '</div>') +
    '</div>';
}
fromLocal();
if (!REPORTS.length) draw();
</script>
