<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GOAT OUT · Зловещие знаки</title>
<style>:root{color-scheme:dark;font:15px/1.5 system-ui;background:#18171b;color:#e6dfd1}body{max-width:1000px;margin:0 auto;padding:28px}h1{font-size:30px;line-height:1.15}p{color:#b6aea7}a{color:#c7a1ec}.controls{display:flex;gap:20px;flex-wrap:wrap;margin:24px 0}label{display:flex;align-items:center;gap:8px}select{padding:6px;background:#302b32;color:inherit;border:1px solid #554d59}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.card{border:1px solid #453b47;background:#242128;border-radius:8px;overflow:hidden}.card canvas{width:192px;height:192px;display:block;margin:auto;image-rendering:pixelated}.caption{padding:12px;border-top:1px solid #453b47}.caption span{display:block;color:#ada4af;font-size:12px}.caption a{font-size:13px}#status{font-size:12px}.tag{font:12px monospace;color:#bb8d9a;letter-spacing:2px}</style>
<div class="tag">GOAT OUT · АТМОСФЕРА</div><h1>Три знака на пол и один на стену</h1><p>Разные мотивы и размеры. В прозрачных местах видна подложка — можно примерить знаки на камень и кирпичи.</p><a href="HANDOFF_CLAUDE.md">Передача Клоду</a> · <a href="prompts.json">Промпты</a>
<div class="controls"><label>Масштаб <select id="zoom"><option value="1">Игровой ×1</option><option value="1.5">×1.5</option></select></label><label>Подложка <select id="bg"><option value="surface">Камень / кирпич</option><option value="dark">Тёмная</option><option value="light">Светлая</option></select></label><label>Непрозрачность <input id="opacity" type="range" min="30" max="100" value="100"><output id="alpha">100%</output></label></div><div class="grid" id="cards"></div><p id="status">Загрузка…</p>
<script src="manifest.js"></script><script>
const p=window.DECALS,images={},views=[],bg=document.querySelector('#bg'),zoom=document.querySelector('#zoom'),opacity=document.querySelector('#opacity');
for(const it of p.items){const card=document.createElement('article');card.className='card';const canvas=document.createElement('canvas');canvas.width=192;canvas.height=192;const cap=document.createElement('div');cap.className='caption';const title=document.createElement('strong');title.textContent=it.label;const desc=document.createElement('span');desc.textContent=(it.surface==='wall'?'Дальняя стена':'Пол')+' · '+it.suggestedWidth+' × '+it.suggestedHeight+' px';const a=document.createElement('a');a.href=it.file;a.textContent='Отдельный PNG ↗';cap.append(title,desc,a);card.append(canvas,cap);document.querySelector('#cards').append(card);views.push({canvas,it});}
function draw(){document.querySelector('#alpha').textContent=opacity.value+'%';for(const{canvas,it}of views){const c=canvas.getContext('2d');c.imageSmoothingEnabled=false;c.globalAlpha=1;c.fillStyle=bg.value==='light'?'#c7beb0':'#242128';c.fillRect(0,0,192,192);if(bg.value==='surface'){const rect=p.backgrounds[it.surface==='wall'?'brick':'stone'];for(let y=0;y<192;y+=64)for(let x=0;x<192;x+=64)c.drawImage(images[p.backgrounds.file],...rect,x,y,64,64);}const w=it.suggestedWidth*Number(zoom.value),h=it.suggestedHeight*Number(zoom.value);c.globalAlpha=Number(opacity.value)/100;c.drawImage(images[it.file],...it.rect,Math.round((192-w)/2),Math.round((192-h)/2),Math.round(w),Math.round(h));c.globalAlpha=1;}}
Promise.all([...p.items.map(i=>i.file),p.backgrounds.file].map(file=>new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>{images[file]=im;resolve();};im.onerror=()=>reject(Error(file));im.src=file;}))).then(()=>{draw();bg.onchange=draw;zoom.onchange=draw;opacity.oninput=draw;document.querySelector('#status').textContent='4 прозрачных PNG загружены. Подложки служат только для примерки.';}).catch(e=>document.querySelector('#status').textContent=e.message);
</script></html>
